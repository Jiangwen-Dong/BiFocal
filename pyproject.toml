[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bifocal"
version = "0.1.0"
description = "BiFocal harness, memory protocol, and role-specific RL training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = [
  "accelerate",
  "bitsandbytes>=0.45,<1",
  "imageio-ffmpeg",
  "peft",
  "Pillow",
  "safetensors",
  "sentencepiece",
  "transformers",
  "vllm",
]
test = ["pytest>=8,<9"]

[project.scripts]
bifocal = "bifocal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
